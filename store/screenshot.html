<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1280px; height: 800px; display: flex; align-items: center; justify-content: center; gap: 96px;
         font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1d2333, #3a2340); color: #fff; }
  .pitch { width: 520px; }
  .pitch img { width: 72px; height: 72px; }
  .pitch h1 { font-size: 52px; margin: 16px 0 12px; }
  .pitch p { font-size: 24px; line-height: 1.4; opacity: 0.85; margin: 0 0 24px; }
  .pitch ul { font-size: 20px; line-height: 1.7; margin: 0; padding-left: 22px; opacity: 0.9; }
  .popup { background: #fff; color: #1a1a1a; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
           transform: scale(1.6); transform-origin: center; }
  .popup body, .popup { font: 13px system-ui, sans-serif; padding: 12px 14px; width: 260px; }
  .popup h1 { font-size: 15px; margin: 0 0 4px; }
  .popup h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 12px 0 2px; }
  .popup label { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .popup label.sub { padding-left: 22px; opacity: .85; }
</style>
</head>
<body>
  <div class="pitch">
    <img src="../icons/icon128.png" alt="">
    <h1>SkipShorts</h1>
    <p>Watch what you came for. No Shorts, no Reels, no feed junk.</p>
    <ul>
      <li>Hides YouTube Shorts everywhere</li>
      <li>Hides Facebook Reels, ads and suggested posts</li>
      <li>Each option can be switched on or off</li>
      <li>No tracking, no data collection</li>
    </ul>
  </div>
  <div class="popup">
    <h1>SkipShorts</h1>
    <h2>YouTube</h2>
    <label><input type="checkbox" checked> Hide Shorts</label>
    <label class="sub"><input type="checkbox" checked> Open Shorts in the normal player</label>
    <h2>Facebook</h2>
    <label><input type="checkbox" checked> Hide Reels</label>
    <label><input type="checkbox" checked> Hide sponsored posts and ads</label>
    <label><input type="checkbox" checked> Hide suggested posts (Follow / Join)</label>
    <label><input type="checkbox" checked> Hide "People you may know" and group suggestions</label>
    <label><input type="checkbox" checked> Hide posts labeled "AI content"</label>
  </div>
</body>
</html>

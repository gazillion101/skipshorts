<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>SkipShorts</h1>

  <h2>YouTube</h2>
  <label><input type="checkbox" id="youtube"> Hide Shorts</label>
  <label class="sub"><input type="checkbox" id="youtubeRedirect"> Open Shorts in the normal player</label>
  <label><input type="checkbox" id="youtubePromos"> Hide "YouTube featured" promo banners</label>

  <h2>Facebook</h2>
  <label><input type="checkbox" id="facebook"> Hide Reels</label>
  <label><input type="checkbox" id="facebookAds"> Hide sponsored posts and ads</label>
  <label><input type="checkbox" id="facebookSuggested"> Hide suggested posts (Follow / Join)</label>
  <label><input type="checkbox" id="facebookCarousels"> Hide "People you may know" and group suggestions</label>
  <label><input type="checkbox" id="facebookAI"> Hide posts labeled "AI content"</label>

  <h2>X</h2>
  <div id="xAccess">
    <button id="xGrant">Turn on for X</button>
    <p class="note">Asks for access to x.com. Reload open X tabs afterwards.</p>
  </div>
  <div id="xOptions">
    <label><input type="checkbox" id="xAds"> Hide promoted posts</label>
    <label><input type="checkbox" id="xFollow"> Hide "Who to follow" suggestions</label>
    <label><input type="checkbox" id="xGrok"> Hide Grok</label>
    <label><input type="checkbox" id="xVideo"> Hide video posts in the home timeline</label>
  </div>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>

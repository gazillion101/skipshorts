<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>SkipShorts</h1>

  <h2>YouTube</h2>
  <label><input type="checkbox" id="youtube"> Hide Shorts</label>
  <label class="sub"><input type="checkbox" id="youtubeRedirect"> Open Shorts in the normal player</label>

  <h2>Facebook</h2>
  <label><input type="checkbox" id="facebook"> Hide Reels</label>
  <label><input type="checkbox" id="facebookAds"> Hide sponsored posts and ads</label>
  <label><input type="checkbox" id="facebookSuggested"> Hide suggested posts (Follow / Join)</label>
  <label><input type="checkbox" id="facebookCarousels"> Hide "People you may know" and group suggestions</label>
  <label><input type="checkbox" id="facebookAI"> Hide posts labeled "AI content"</label>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
